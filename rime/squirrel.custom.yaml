# encoding: utf-8

patch:
  style/color_scheme: catppuccin_latte
  style/color_scheme_dark: catppuccin_macchiato
  style/candidate_list_layout: linear
  style/text_orientation: horizontal
  style/inline_preedit: true
  style/inline_candidate: false
  style/candidate_format: "%c %@ "
  style/corner_radius: 6
  style/hilited_corner_radius: 5
  style/line_spacing: 10
  style/border_height: 1
  style/border_width: 1
  style/font_face: "PingFangSC"
  style/font_point: 16
  style/label_font_point: 13
  style/comment_font_point: 14

  app_options/com.apple.Spotlight/ascii_mode: true
  app_options/com.apple.Terminal/ascii_mode: true
  app_options/com.apple.Terminal/no_inline: true
  app_options/com.googlecode.iterm2/ascii_mode: true
  app_options/com.googlecode.iterm2/no_inline: true
  app_options/com.microsoft.VSCode/ascii_mode: true

  preset_color_schemes/catppuccin_latte:
